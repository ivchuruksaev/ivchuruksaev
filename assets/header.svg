<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Ivan Churuksaev — AI and Research Engineer</title>
  <desc id="desc">Colorful profile header with a dark indigo gradient, graph nodes, and research engineering tagline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.48" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1025" cy="42" r="170" fill="#22d3ee" opacity="0.10"/>
  <circle cx="1115" cy="320" r="210" fill="#c084fc" opacity="0.10"/>
  <circle cx="70" cy="325" r="150" fill="#818cf8" opacity="0.09"/>

  <g opacity="0.72" stroke-linecap="round">
    <path d="M900 92 L1010 55 L1096 126 L1017 208 L912 177 L865 260 L1000 294 L1112 255" fill="none" stroke="#a5f3fc" stroke-width="3" opacity="0.55"/>
    <path d="M1010 55 L1017 208 L1112 255 M900 92 L1096 126 L1112 255 M912 177 L1017 208 L1000 294" fill="none" stroke="#d8b4fe" stroke-width="2" opacity="0.42"/>
    <g fill="#f8fafc">
      <circle cx="900" cy="92" r="8"/>
      <circle cx="1010" cy="55" r="10"/>
      <circle cx="1096" cy="126" r="8"/>
      <circle cx="1017" cy="208" r="12"/>
      <circle cx="912" cy="177" r="7"/>
      <circle cx="865" cy="260" r="9"/>
      <circle cx="1000" cy="294" r="8"/>
      <circle cx="1112" cy="255" r="10"/>
    </g>
    <g fill="#67e8f9" filter="url(#glow)" opacity="0.55">
      <circle cx="1017" cy="208" r="18"/>
      <circle cx="1010" cy="55" r="15"/>
    </g>
  </g>

  <rect x="72" y="62" width="166" height="34" rx="17" fill="#ffffff" opacity="0.12"/>
  <text x="155" y="85" text-anchor="middle" fill="#cffafe" font-size="15" font-family="Segoe UI, Arial, sans-serif" font-weight="600" letter-spacing="2">HELLO, I BUILD</text>

  <text x="70" y="166" fill="#ffffff" font-size="58" font-family="Segoe UI, Arial, sans-serif" font-weight="750">Ivan Churuksaev</text>
  <rect x="72" y="190" width="670" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="72" y="240" fill="#e0e7ff" font-size="27" font-family="Segoe UI, Arial, sans-serif">AI / Research Engineer</text>
  <text x="72" y="282" fill="#bae6fd" font-size="20" font-family="Segoe UI, Arial, sans-serif">Graph algorithms  ·  Scientific ML  ·  Tools for curious people</text>
  <text x="72" y="320" fill="#c4b5fd" font-size="16" font-family="Segoe UI, Arial, sans-serif">From physical models to working software.</text>
</svg>

